# Configuration for snifdog, the SNIF CA Transparency watchdog: an example,
# installed as /usr/share/snifdog/snifdog.conf.example. Nothing reads it there.
#
# One configuration watches one base domain: copy this to
# /etc/snif/snifdog.d/<base>.conf for each base (e.g. snif.xyz.conf), set
# SNIFDOG_BASE and SNIFDOG_NAME_ALLOW, and enable snifdog@<base>, or the
# cron entry, which runs every file there. A single /etc/snif/snifdog.conf,
# the path from before snifdog.d, still works (snifdog.service); a snifdog
# command without $SNIFDOG_CONF reads that one.
#
# This file is shell-sourced (after /etc/snif/snif.conf), so ${SNIF_CA_PROXY} and the
# other SNIF_* variables are available for interpolation. Lists are
# space-separated, quoted.


# Base directory for snifdog state (pins, cursor, evidence bundles). Defaults
# to /var/lib/snif/snifdog for /etc/snif/snifdog.conf, and to
# /var/lib/snif/snifdog/<base> for any other configuration. Two base domains
# must never share one: the CT cursors under var/ are per base, and snifdog
# refuses a directory that another base already owns.
#SNIFDOG_DIR=/var/lib/snif/snifdog

# The DNS namespace to watch. include_subdomains is always on, so this covers
# every SNIF device name under the base (e.g. *.snif-1a2b.snif.xyz).
SNIFDOG_BASE=snif.xyz

# CT data source: certspotter (default; inline DER + resumable cursor) or crtsh
# (fallback; whole-history query + per-cert DER fetch, id high-water mark).
SNIFDOG_SOURCE=certspotter

# First-run history backfill (only with the certspotter source). certspotter
# resumes from a stored cursor -- ideal for steady state -- but its free plan
# returns only currently-valid certs; expired issuances are omitted entirely
# (expired=true is rejected as not_allowed_by_plan). So until it has seeded once
# (tracked by var/backfill.done) snifdog seeds the pin DB from crt.sh, which
# serves the complete history including expired certs, then hands off to
# certspotter for cheap incremental polling. If crt.sh is down the seed is
# retried on the next pass (the marker is only written on success). Set to 0 to
# anchor only from live CT onward.
SNIFDOG_BACKFILL=1

# Run mode:
#   watch     -- independent watcher, no CA-proxy ledger. Trusts neither the
#                relay nor the CA-proxy operator. This is the mode that actually
#                delivers guarantee #3; run it as a device owner or third party.
#   reconcile -- co-located with the CA proxy: cross-check every CT observation
#                against the local issuance ledger (crt/ arc/ csr/) to
#                auto-classify the operator's own reissues and cut false alarms.
#   both      -- watch semantics enriched with the ledger cross-check.
SNIFDOG_MODE=watch

# Name-bound CSR validation is enabled automatically whenever ${SNIF_CA_PROXY}/csr
# exists (i.e. snifdog runs co-located with the CA proxy) -- no setting required.
# For every local relay domain (a subdomain of a base listed in the CA proxy's
# etc/<init-domain>.domains) the first cert seen has its SPKI checked against
# csr/<apex>.csr, the one key SNIF binds to that name for life. A match anchors
# as csr-verified (stronger than trust-on-first-use); a mismatch alerts at once
# as a proven mis-issuance and the foreign key is never anchored.

# Infrastructure names inside the base that are legitimate but are NOT per-device
# `snif-<id>` zones (so they would otherwise be flagged as unexpected). The SNIF
# initialization domain and the relay pool host go here. snifdog IGNORES these
# names entirely -- not anchored, no CSR check, no alert -- because they are
# managed outside the SNIF device model and do not follow the never-re-key rule,
# so a routine key rotation on them must not raise a false alarm. Since a listed
# name is not watched at all, list only names that get certificates.
SNIFDOG_NAME_ALLOW="snif.snif.xyz snif-pool.snif.xyz"

# Optional: expected issuer substring(s) (e.g. "Let's Encrypt"). Advisory only
# -- a rogue cert with a foreign key alerts on SPKI regardless of issuer.
SNIFDOG_ISSUER_ALLOW=""

# Alert sinks. syslog is always structured (LOG_DAEMON/LOG_CRIT on alert).
SNIFDOG_SYSLOG=1
SNIFDOG_WEBHOOK=""
SNIFDOG_EMAIL=""

# Optional certspotter API token (raises the free-tier rate limit; helps the
# full-history backfill of a large namespace). Leave empty for anonymous access.
SNIFDOG_CERTSPOTTER_TOKEN=""

# `snifdog watch` loop interval, seconds.
SNIFDOG_POLL_INTERVAL=900

# reconcile mode uses ${SNIF_CA_PROXY} from /etc/snif/snif.conf for the ledger path.
