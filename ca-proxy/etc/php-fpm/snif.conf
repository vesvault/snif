; An example PHP-FPM pool for the SNIF CA proxy's PHP (public_html/ and
; secure_html/), as the snif-www user the install makes (README, "Users and
; groups"). Not installed: copy it to the pool directory of your PHP-FPM,
; e.g. /etc/php/8.4/fpm/pool.d/snif.conf on Debian, and set the socket's
; path and owner for your web server.
;
; Its own user, so that the web server and any other PHP on the host stay
; out of snif and snif-rw: group snif reads etc/, and snif-rw, which
; snif-www is in, writes the tree. PHP-FPM gives each worker the user's
; groups when it starts, so a reload takes a change of groups.
[snif]
user = snif-www
group = snif
listen = /run/php/php-fpm-snif.sock
; Only the web server may use the socket: www-data on Debian, apache on
; Fedora and RHEL.
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Few requests, from devices enrolling and fetching certificates.
pm = ondemand
pm.max_children = 16
pm.process_idle_timeout = 30s
pm.max_requests = 500
; Ends a request stuck on snif-certd's pipe, which blocks while nothing
; reads it.
request_terminate_timeout = 120s
security.limit_extensions = .php
catch_workers_output = yes
decorate_workers_output = no

; The web server hands the CA proxy's .php to this pool, in both docroots,
; e.g. for Apache with mod_proxy_fcgi:
;   <FilesMatch "\.php$">
;       SetHandler "proxy:unix:/run/php/php-fpm-snif.sock|fcgi://snif-ca"
;   </FilesMatch>
